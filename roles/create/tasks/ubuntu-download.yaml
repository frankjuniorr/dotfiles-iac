---
- name: "Run shell script on remote host"
  ansible.builtin.script: "files/ubuntu-download.sh"
  register: iso_url_result

- name: "Ubuntu | Define ISO URL"
  ansible.builtin.set_fact:
    iso_url: "{{ iso_url_result.stdout_lines[0] }}"

- name: "Ubuntu | Define ISO filename"
  ansible.builtin.set_fact:
    iso_file: "{{ iso_url | basename }}"
