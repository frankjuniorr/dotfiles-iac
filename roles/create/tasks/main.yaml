---

- name: "Load OS-specific variables"
  ansible.builtin.include_vars:
    file: "group_vars/{{ os }}.yaml"
  when: os_type is defined

- name: "Identify Arch Linux ISO URL"
  ansible.builtin.include_tasks: arch-download.yaml
  when: vm_user == 'arch'

- name: "Identify Ubuntu ISO URL"
  ansible.builtin.include_tasks: ubuntu-download.yaml
  when: vm_user == 'ubuntu'

- name: "Identify Omarchy ISO URL"
  ansible.builtin.include_tasks: omarchy-download.yaml
  when: vm_user == 'omarchy'

- name: "Debug complete ISO URL"
  ansible.builtin.debug:
    msg: "{{ iso_url }}"
  changed_when: false

- name: "Check if ISO file already exists"
  ansible.builtin.stat:
    path: "{{ iso_directory }}/{{ iso_file }}"
  register: iso_stat

- name: "Download ISO file"
  ansible.builtin.get_url:
    url: "{{ iso_url }}"
    dest: "{{ iso_directory }}"
  when: not iso_stat.stat.exists

- name: "Create VM on Proxmox"
  ansible.builtin.include_tasks: proxmox-create-vm.yaml
