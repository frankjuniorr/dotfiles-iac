---

- name: "Load OS-specific variables"
  ansible.builtin.include_vars:
    file: "group_vars/{{ os }}.yaml"
  when: os_type is defined

- name: "Check if template VM already exists"
  ansible.builtin.shell: qm list | awk '{print $1}' | grep -x "{{ vm_template_id }}"
  register: vm_exists
  failed_when: false
  changed_when: false

- name: "Check if template VM is running"
  ansible.builtin.shell: |
    qm status {{ vm_template_id }} | grep -q "status: running"
  register: vm_running
  failed_when: false
  changed_when: false
  when: vm_exists.rc == 0

- name: "Stop template VM before post-install"
  ansible.builtin.shell: |
    qm stop {{ vm_template_id }}
  when: vm_exists.rc == 0 and vm_running.rc == 0
  register: stop_vm_result
  changed_when: true
  failed_when: stop_vm_result.rc != 0

- name: "Wait for template VM to be stopped"
  ansible.builtin.shell: |
    qm status {{ vm_template_id }} | grep -q "status: stopped"
  register: vm_stop_wait
  until: vm_stop_wait.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  when: vm_exists.rc == 0 and vm_running.rc == 0

- name: "Change boot order, remove CDROM, convert to template, and clone"
  ansible.builtin.shell: "{{ vm_post_install }}"
  loop:
    - "qm set {{ vm_template_id }} -ide2 media=cdrom,file=none"
    - "qm set {{ vm_template_id }} --bootdisk scsi0"
    - "qm template {{ vm_template_id }}"
    - "qm clone {{ vm_template_id }} {{ vm_id }} --name {{ vm_name }} --full 1"
  loop_control:
    loop_var: "vm_post_install"
  when: vm_exists.rc == 0


# Deploy Notes
###############################################################
- name: "Render VM notes templates to /tmp"
  ansible.builtin.template:
    src: "{{ note_file.src }}"
    dest: "{{ note_file.dest }}"
  loop:
    - {src: "notes.md.j2", dest: "/tmp/notes_creation.md"}
    - {src: "notes_template.md.j2", dest: "/tmp/notes_template_creation.md"}
  loop_control:
    loop_var: note_file

- name: "Apply notes to VM and template descriptions"
  ansible.builtin.shell: "qm set {{ note_target.id }} --description \"$(cat {{ note_target.template }})\""
  loop:
    - {id: "{{ vm_template_id }}", template: "/tmp/notes_template_creation.md"}
    - {id: "{{ vm_id }}", template: "/tmp/notes_creation.md"}
  loop_control:
    loop_var: note_target

- name: "Remove temporary VM notes files"
  ansible.builtin.file:
    path: "{{ note_path }}"
    state: absent
  loop:
    - "/tmp/notes_template_creation.md"
    - "/tmp/notes_creation.md"
  loop_control:
    loop_var: note_path
